name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: raguser
          POSTGRES_PASSWORD: ragpass
          POSTGRES_DB: ragdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyTorch (CPU-only)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Initialize database
        env:
          DATABASE_URL: postgresql://raguser:ragpass@localhost:5432/ragdb
        run: python -c "from app.db.session import init_db; init_db()"
      - name: Security scan (pip-audit)
        run: |
          pip install pip-audit
          pip-audit --desc -r requirements.txt || true

      - name: Run tests
        env:
          DATABASE_URL: postgresql://raguser:ragpass@localhost:5432/ragdb
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          GROK_MODEL: llama-3.3-70b-versatile
          GROK_BASE_URL: https://api.groq.com/openai/v1
          LLM_PROVIDER: grok
          EMBEDDING_PROVIDER: sentence-transformers
          VECTORSTORE_PROVIDER: faiss
          FAISS_INDEX_DIR: ./data/faiss_index
        run: pytest -v